grid-template-columns:repeat(auto-fill,minmax(265px,1fr));gap:24px}.card{background:#ffffffa8;border:1px solid white;border-radius:22px;padding:10px;position:relative;box-shadow:0 4px 20px #25324e05;transition:transform .2s,box-shadow .2s}.card:hover{transform:translateY(-3px);box-shadow:0 12px 30px #25324e10}.card-open{width:100%;text-align:left;padding:0}.thumb{height:178px;width:100%;object-fit:contain;background:white;border-radius:15px}.card-title{font-size:16px;font-weight:600;margin:18px 12px 6px;max-width:80%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.card-date{margin:0 12px 16px;color:#969ba4;font-size:12px}.card-menu{position:absolute;right:13px;bottom:18px;color:#9298a1}.newcard{min-height:262px;border:1px dashed #cbd2df;border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;color:#858b98;transition:background .2s}.newcard:hover{background:#ffffffa0}.newcard .plus{font-size:36px;font-weight:200;color:#9faeff}.footer{margin-top:40px;color:#a0a5af;font-size:12px;display:flex;justify-content:space-between}.editor{display:none;height:100vh;background:white}canvas#board{display:block;width:100vw;height:100vh;touch-action:none}.topbar{position:absolute;left:22px;top:20px;height:64px;display:flex;align-items:center;padding:7px 12px;gap:9px}.separator{height:26px;width:1px;background:#e1e4e9;margin:0 6px}.board-title{width:190px;border:0;background:none;outline:none;font-weight:550}.save{font-size:11px;color:#9298a1;min-width:62px}.topright{position:absolute;right:22px;top:20px;display:flex;padding:9px;gap:4px}.tools{position:absolute;left:50%;bottom:28px;transform:translateX(-50%);padding:9px;display:flex;gap:5px}.tools .active{background:#e8ecff;color:#657ae7}.properties{position:absolute;left:24px;top:112px;display:flex;flex-direction:column;gap:14px;padding:16px 10px;align-items:center}.color{width:24px;height:24px;border-radius:50%;border:3px solid white;outline:1px solid transparent;padding:0}.color.chosen{outline-color:#7c86a1}.stroke{width:30px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:7px}.stroke.active{background:#e8ecff}.stroke span{background:currentColor;border-radius:8px;width:18px}.zoom{position:absolute;bottom:28px;right:24px;display:flex;align-items:center;padding:6px}.zoom-label{min-width:56px;text-align:center;font-size:12px}.hint{position:absolute;bottom:40px;left:24px;color:#a4a9b2;font-size:11px;pointer-events:none}.toast{position:absolute;left:50%;top:105px;transform:translateX(-50%);padding:12px 20px;border-radius:13px;background:#2a303a;color:white;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:5}.toast.show{opacity:1}.empty{position:absolute;top:42%;left:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;color:#c0c5cf}.empty h2{font-size:29px;letter-spacing:-1px;font-weight:450;margin-bottom:12px}.empty p{font-size:13px}.text-edit{position:absolute;z-index:8;resize:none;border:1px solid #9bafff;background:#fffef6;outline:none;padding:8px;border-radius:5px;min-width:180px;min-height:70px}.modal{position:fixed;inset:0;background:#1e263440;display:none;place-items:center;z-index:20}.modal.open{display:grid}.dialog{width:420px;background:#fff;padding:30px;border-radius:24px;box-shadow:0 24px 80px #0002}.dialog h2{margin:0 0 15px;font-size:22px}.dialog p{color:#818895;font-size:14px;line-height:1.7}.dialog .actions{display:flex;justify-content:end;gap:12px;margin-top:25px}.dialog .actions button{padding:10px 16px;border-radius:10px}.danger{background:#fff0f1;color:#c34c61}.help-row{display:flex;justify-content:space-between;border-bottom:1px solid #eef0f3;padding:9px 0;font-size:13px}.help-row span:last-child{color:#969ba4} @media(max-width:1100px){.hint{display:none}.tools{bottom:24px;gap:1px}.tools .icon{width:39px}.zoom{bottom:95px}.home{padding:30px}.topbar{left:15px}.board-title{width:145px}}

<section class="home" id="home"><header><div class="brand"><span class="brandmark" id="logo"></span>glassboard</div><button class="primary" id="newTop">＋ New board</button></header><div class="hero"><div><h1>Room for your next idea.</h1><p>A clean canvas. A little clarity. Everything in one place.</p></div><input class="search" id="search" placeholder="Search your boards" aria-label="Search boards"></div><div class="grid" id="grid"></div><div class="footer"><span id="boardCount">Loading your boards…</span><span>Shared workspace · Automatically saved</span></div></section>
<section class="editor" id="editor"><canvas id="board"></canvas><div class="topbar glass"><button class="icon" id="back" title="All boards"></button><div class="separator"></div><input id="title" class="board-title" aria-label="Board name" maxlength="120"><span class="save" id="save">Saved</span></div><div class="topright glass"><button class="icon" id="undo" title="Undo (Ctrl+Z)"></button><button class="icon" id="redo" title="Redo (Ctrl+Shift+Z)"></button><div class="separator"></div><button class="icon" id="export" title="Export PNG"></button><button class="icon" id="fullscreen" title="Full screen"></button><button class="icon" id="help" title="Shortcuts and help"></button></div><div class="properties glass" id="properties"></div><div class="empty" id="empty"><h2>Make space for an idea.</h2><p>Draw, drop an image, or add a note.</p></div><div class="tools glass" id="tools"></div><div class="hint">Scroll to zoom · Space + drag to pan · Paste an image</div><div class="zoom glass"><button class="icon" id="minus" title="Zoom out"></button><span class="zoom-label" id="zoomLabel">100%</span><button class="icon" id="plus" title="Zoom in"></button><div class="separator"></div><button class="icon" id="fit" title="Fit content"></button></div></section><div class="toast" id="toast"></div><input type="file" accept="image/png,image/jpeg,image/webp,image/gif" id="imageInput" hidden multiple><div class="modal" id="modal"><div class="dialog" id="dialog"></div></div>
<script type="module">
import {equal,mergeSnapshots} from "/merge.mjs";
function makeId(){if(globalThis.crypto?.randomUUID)return crypto.randomUUID();const bytes=new Uint8Array(16);crypto.getRandomValues(bytes);bytes[6]=(bytes[6]&15)|64;bytes[8]=(bytes[8]&63)|128;return [...bytes].map((v,i)=>([4,6,8,10].includes(i)?'-':'')+v.toString(16).padStart(2,'0')).join('')}
const $=id=>document.getElementById(id);const paths={logo:'M5 16L12 5l7 11M8 12h8M5 20h14',back:'M14 5l-7 7 7 7',select:'M5 3l15 10-7 2-3 7z',pen:'M4 20l4-1L20 7l-3-3L5 16zM14 7l3 3',hand:'M7 11V7a2 2 0 014 0v4-7a2 2 0 014 0v7-5a2 2 0 014 0v5-2a2 2 0 014 0v6c0 6-3 9-7 9-3 0-5-2-7-5l-3-4a2 2 0 013-3l2 2',rect:'M4 4h16v16H4z',ellipse:'M20 12a8 8 0 11-16 0 8 8 0 0116 0',arrow:'M4 20L20 4M10 4h10v10',note:'M4 4h16v11l-5 5H4zM15 20v-5h5',text:'M4 5h16M12 5v15M8 20h8',image:'M4 4h16v16H4zM4 16l5-5 4 4 3-3 4 4M15 8h.01',eraser:'M3 14L13 4l7 7-9 9H8zM7 10l7 7M11 20h10',undo:'M8 5L3 10l5 5M3 10h11a6 6 0 010 12',redo:'M16 5l5 5-5 5M21 10H10a6 6 0 000 12',export:'M12 15V3M7 8l5-5 5 5M4 15v6h16v-6',fullscreen:'M8 3H3v5M16 3h5v5M3 16v5h5M21 16v5h-5',help:'M9 8a3 3 0 016 0c0 3-3 2-3 5M12 17h.01M22 12a10 10 0 11-20 0 10 10 0 0120 0',minus:'M5 12h14',plus:'M5 12h14M12 5v14',fit:'M8 3H3v5M16 3h5v5M3 16v5h5M21 16v5h-5M8 8h8v8H8',trash:'M3 6h18M9 6V3h6v3M6 6l1 15h10l1-15M10 10v7M14 10v7'};const icon=n=>'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="'+paths[n]+'"/></svg>';for(const n of ['logo','back','undo','redo','export','fullscreen','help','minus','plus','fit'])$(n).innerHTML=icon(n);
const toolNames={select:'Select · V',hand:'Pan · H',pen:'Draw · P',eraser:'Erase · E',rect:'Rectangle · R',ellipse:'Ellipse · O',arrow:'Arrow · A',note:'Sticky note · N',text:'Text · T',image:'Add image · I'};for(const [k,v]of Object.entries(toolNames)){const b=document.createElement('button');b.className='icon';b.title=v;b.setAttribute('aria-label',v);b.dataset.tool=k;b.innerHTML=icon(k);b.onclick=()=>k==='image'?$('imageInput').click():setTool(k);$('tools').append(b)}
let boards=[],current=null,items=[],view={x:0,y:0,z:1},tool='select',color='#303746',width=3,selected=null,gesture=null,pointers=new Map(),space=false,history=[],future=[],saveTimer,renderPending=false,textEditor=null,version=0,saveChain=Promise.resolve(),deleting=false;let baseline=null,saveInFlight=false,polling=false,recovering=false;const clientId=sessionStorage.getItem('glassboard-client')||makeId();sessionStorage.setItem('glassboard-client',clientId);const recoveryPrefix='glassboard-recovery:'+clientId+':';const images=new Map();const canvas=$('board'),ctx=canvas.getContext('2d');let W=innerWidth,H=innerHeight;const uid=()=>makeId();const clone=o=>structuredClone(o);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function toast(s){$('toast').textContent=s;$('toast').classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('toast').classList.remove('show'),2800)}
async function api(path,options={}){const r=await fetch('/api/'+path,options);if(r.status===204)return null;const data=await r.json().catch(()=>({error:'Unable to complete request'}));if(!r.ok){const error=new Error(data.error||'Unable to complete request');error.status=r.status;error.data=data;throw error}return data}
function recoveries(){const out=[];for(let i=0;i<localStorage.length;i++){const key=localStorage.key(i);if(!key.startsWith(recoveryPrefix))continue;try{const record=JSON.parse(localStorage.getItem(key));if(record?.board?.id)out.push(record)}catch{}}return out}
async function loadBoards(){try{boards=await api('boards');for(const r of recoveries())if(!boards.some(b=>b.id===r.board.id))boards.push({...r.board,updated:r.savedAt});showBoards()}catch(e){boards=recoveries().map(r=>({...r.board,updated:r.savedAt}));showBoards();$('boardCount').textContent='Server offline · browser recovery copies';toast('Cannot reach the server. Your unsaved work is kept in this browser.')}}

function showBoards(){const q=$('search').value.toLowerCase();$('grid').innerHTML='<button class="newcard" id="newCard"><span class="plus">＋</span><span>A fresh canvas</span></button>'+boards.filter(b=>b.title.toLowerCase().includes(q)).sort((a,b)=>b.updated-a.updated).map(b=>'<article class="card"><button class="card-open" data-open="'+b.id+'"><img class="thumb" alt="" src="'+(b.thumb||'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22/%3E')+'"><div class="card-title">'+esc(b.title)+'</div><div class="card-date">'+new Date(b.updated).toLocaleDateString(undefined,{month:'short',day:'numeric'})+'</div></button><button class="icon card-menu" data-delete="'+b.id+'" title="Delete board">'+icon('trash')+'</button></article>').join('');$('newCard').onclick=newBoard;document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openBoard(b.dataset.open));document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>deleteBoard(b.dataset.delete));$('boardCount').textContent=boards.length+' board'+(boards.length===1?'':'s')}
function confirmDialog(title,message,action){$('dialog').innerHTML='<h2>'+esc(title)+'</h2><p>'+esc(message)+'</p><div class="actions"><button id="cancelDialog">Cancel</button><button class="danger" id="confirmDialog">Delete</button></div>';$('modal').classList.add('open');$('cancelDialog').onclick=()=>$('modal').classList.remove('open');$('confirmDialog').onclick=async()=>{$('modal').classList.remove('open');await action()}}
function deleteBoard(id){confirmDialog('Delete this board?','This permanently removes the board.',async()=>{try{await api('boards/'+id,{method:'DELETE',headers:{'If-Match':String(boards.find(b=>b.id===id)?.revision||0)}});localStorage.removeItem(recoveryPrefix+id);boards=boards.filter(b=>b.id!==id);showBoards()}catch(e){toast(e.status===409?'This board changed. The list has been refreshed.':'Could not delete board');loadBoards()}})}
async function newBoard(){const b={id:uid(),title:'Untitled board',items:[],view:{x:0,y:0,z:1},updated:Date.now(),thumb:''};activate(b,null);changed()}
async function openBoard(id){try{let remote=null;let cached;try{cached=JSON.parse(localStorage.getItem(recoveryPrefix+id))}catch{}try{remote=await api('boards/'+id)}catch(e){if(!cached)throw e;if(e.status&&e.status!==404)throw e}
if(cached){if(remote&&cached.base){const merged=mergeSnapshots(cached.base,cached.board,remote);if(merged.conflicts.length){activate(cached.board,cached.base);await preserveConflict('Another person changed the same object while you were away.');return}activate(merged.board,remote);if(hasChanges())scheduleSave()}else if(!remote&&cached.base){activate(cached.board,cached.base);await preserveConflict('The original board was deleted while you were away.');return}else{activate(cached.board,remote);scheduleSave()}}else activate(remote,remote)
}catch(e){toast('Could not open this board. Check the server connection.')}}
function activate(b,serverBoard=b){current=clone(b);baseline=serverBoard?clone(serverBoard):null;items=clone(b.items);try{view=JSON.parse(localStorage.getItem('glassboard-view:'+b.id))||b.view||{x:0,y:0,z:1}}catch{view=b.view||{x:0,y:0,z:1}}history=[];future=[];selected=null;gesture=null;version=0;$('title').value=b.title;$('home').style.display='none';$('editor').style.display='block';$('save').textContent='Saved';setTool('select');resize();for(const o of items)if(o.type==='image')loadImage(o.src);if(location.hash!=='#'+b.id)historyReplace(b.id)}

function historyReplace(id){window.history.replaceState(null,'',id?'#'+id:location.pathname)}
async function goHome(){finishText();if(gesture){gesture=null;releasePointers()}clearTimeout(saveTimer);await persist();if(hasChanges()&&$('save').textContent==='Saving…')await persist();await saveChain;cacheRecovery();current=null;$('editor').style.display='none';$('home').style.display='block';historyReplace('');loadBoards()}
function checkpoint(){history.push(clone(items));if(history.length>60)history.shift();future=[];buttons()}
function buttons(){$('undo').disabled=!history.length;$('redo').disabled=!future.length}
function changed(){version++;render();scheduleSave()}
function snapshot(){return{id:current.id,title:$('title').value.trim()||'Untitled board',items:clone(items),view:clone(view),updated:Date.now(),thumb:''}}
function hasChanges(){return current&&(!baseline||baseline.title!==($('title').value.trim()||'Untitled board')||!equal(baseline.items,items))}
function cacheRecovery(){if(!current)return;try{localStorage.setItem('glassboard-view:'+current.id,JSON.stringify(view));if(hasChanges())localStorage.setItem(recoveryPrefix+current.id,JSON.stringify({board:snapshot(),base:baseline,savedAt:Date.now()}));else localStorage.removeItem(recoveryPrefix+current.id)}catch{toast('Browser recovery storage is full. Keep this tab open until the server saves.')}}
function scheduleSave(){if(!current)return;cacheRecovery();if(!hasChanges())return;$('save').textContent='Saving…';clearTimeout(saveTimer);saveTimer=setTimeout(persist,650)}
function rebaseUndo(before,remote){function update(stack){const result=[];for(const entry of stack){const m=mergeSnapshots({title:before.title,items:before.items},{title:before.title,items:entry},remote);if(m.conflicts.length)return [];result.push(m.board.items)}return result}history=update(history);future=update(future)}
function acceptRemote(before,remote){const local=snapshot(),m=mergeSnapshots(before,local,remote);if(m.conflicts.length)return false;rebaseUndo(before,remote);const selectionId=selected?.id;items=m.board.items;$('title').value=m.board.title;selected=items.find(o=>o.id===selectionId)||null;current={...remote,items:clone(items),title:m.board.title};baseline=clone(remote);cacheRecovery();render();return true}
async function preserveConflict(reason){if(recovering||!current)return;recovering=true;$('back').disabled=true;const oldId=current.id,copy=snapshot();copy.id=uid();copy.title=(copy.title.slice(0,100)+' (recovered)').slice(0,120);copy.thumb=thumbnail();copy.updated=Date.now();activate(copy,null);cacheRecovery();try{const saved=await api('boards/'+copy.id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({create:true,board:copy})});baseline=clone(saved);current=clone(saved);localStorage.removeItem(recoveryPrefix+oldId);cacheRecovery();$('save').textContent='Saved';toast('Your edits were saved to a recovery board.')}catch(e){$('save').textContent='Retry save';toast('Recovery copy kept in this browser. Retry saving when connected.')}finally{recovering=false;$('back').disabled=false}
$('dialog').innerHTML='<h2>Your edits are safe.</h2><p>'+esc(reason)+' Your work is preserved in this recovery board. The original board keeps the other person’s changes.</p><div class="actions"><button class="primary" id="closeRecovery">Continue here</button></div>';$('modal').classList.add('open');$('closeRecovery').onclick=()=>$('modal').classList.remove('open')}
function persist(){if(!current||recovering)return saveChain;if(saveInFlight)return saveChain;if(gesture||textEditor){clearTimeout(saveTimer);saveTimer=setTimeout(persist,400);return saveChain}if(!hasChanges()){$('save').textContent='Saved';cacheRecovery();return saveChain}saveInFlight=true;const sent=snapshot(),base=baseline?clone(baseline):null;sent.thumb=thumbnail();$('save').textContent='Saving…';
saveChain=(async()=>{try{const response=await api('boards/'+sent.id,{method:base?'PATCH':'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(base?{base:{title:base.title,items:base.items},baseRevision:base.revision,board:sent}:{create:true,board:sent})});const remote=base?response.board:response;while(current?.id===sent.id&&(gesture||textEditor))await new Promise(resolve=>setTimeout(resolve,60));if(current?.id!==sent.id)return;if(!acceptRemote(sent,remote)){await preserveConflict('You and another person edited the same object.');return}$('save').textContent=hasChanges()?'Saving…':'Saved';const i=boards.findIndex(x=>x.id===remote.id);if(i<0)boards.push(remote);else boards[i]=remote}catch(e){if(current?.id!==sent.id)return;if(e.status===409||e.status===404){await preserveConflict(e.status===404?'The original board was deleted.':'You and another person edited the same object.')}else{$('save').textContent='Retry save';cacheRecovery();toast('Server save failed. Your work is kept in this browser.')}}finally{saveInFlight=false;if(current&&hasChanges()&&$('save').textContent!=='Retry save')scheduleSave()}})();return saveChain}
async function poll(){if(polling||saveInFlight||recovering||document.hidden)return;polling=true;const polledId=current?.id;try{if(!current){if(!document.activeElement.matches('input'))await loadBoards();return}if(!baseline||gesture||textEditor||pointers.size||document.activeElement===$('title'))return;const id=current.id,before=clone(baseline);const remote=await api('boards/'+id+'?revision='+baseline.revision);if(!remote)return;if(current?.id!==id||gesture||textEditor||saveInFlight)return;if(remote.revision!==baseline.revision){if(!acceptRemote(before,remote))await preserveConflict('Another person edited an object you were changing.');else if(hasChanges())scheduleSave();else $('save').textContent='Saved'}}catch(e){if(e.status===404&&current?.id===polledId){if(hasChanges())await preserveConflict('The original board was deleted.');else{current=null;$('editor').style.display='none';$('home').style.display='block';historyReplace('');toast('This board was deleted by someone else.');loadBoards()}}}finally{polling=false}}
setInterval(poll,2000);window.addEventListener('online',()=>{if(current)persist();else loadBoards()});document.addEventListener('visibilitychange',()=>{if(!document.hidden)poll();else cacheRecovery()});

$('save').onclick=persist;function undo(){finishText();if(!history.length)return;future.push(clone(items));items=history.pop();selected=null;buttons();changed()}function redo(){if(!future.length)return;history.push(clone(items));items=future.pop();selected=null;buttons();changed()}

function resize(){W=innerWidth;H=innerHeight;const d=Math.min(devicePixelRatio||1,2);canvas.width=W*d;canvas.height=H*d;ctx.setTransform(d,0,0,d,0,0);render()}window.addEventListener('resize',resize);function render(){if(renderPending)return;renderPending=true;requestAnimationFrame(()=>{renderPending=false;paint()})}function paint(){ctx.save();ctx.clearRect(0,0,W,H);ctx.translate(view.x,view.y);ctx.scale(view.z,view.z);for(const o of items){const b=bounds(o);if((b.x+b.w)*view.z+view.x<-100||b.x*view.z+view.x>W+100||(b.y+b.h)*view.z+view.y<-100||b.y*view.z+view.y>H+100)continue;drawObject(ctx,o)}if(selected){const b=bounds(selected);ctx.strokeStyle='#8c9df4';ctx.lineWidth=1/view.z;ctx.setLineDash([5/view.z,4/view.z]);ctx.strokeRect(b.x-5/view.z,b.y-5/view.z,b.w+10/view.z,b.h+10/view.z);ctx.setLineDash([]);if(selected.type!=='pen'){ctx.fillStyle='white';ctx.fillRect(b.x+b.w-5/view.z,b.y+b.h-5/view.z,10/view.z,10/view.z);ctx.strokeRect(b.x+b.w-5/view.z,b.y+b.h-5/view.z,10/view.z,10/view.z)}}ctx.restore();$('empty').style.display=items.length?'none':'block';$('zoomLabel').textContent=Math.round(view.z*100)+'%';buttons()}

canvas.onpointerdown=e=>{if(e.button!==0&&e.button!==1)return;finishText();canvas.setPointerCapture(e.pointerId);pointers.set(e.pointerId,position(e));if(pointers.size===2){if(gesture?.kind==='draw'){items.pop();history.pop();future=[]}const [a,b]=[...pointers.values()];gesture={kind:'pinch',distance:distance(a,b),z:view.z,center:world({x:(a.x+b.x)/2,y:(a.y+b.y)/2})};render();return}const p=world(position(e));if(space||tool==='hand'||e.button===1){gesture={kind:'pan',start:position(e),x:view.x,y:view.y};return}if(tool==='select'){let resizeHit=false;if(selected&&selected.type!=='pen'){const b=bounds(selected);resizeHit=distance(p,{x:b.x+b.w,y:b.y+b.h})<12/view.z}selected=resizeHit?selected:hit(p);if(selected){checkpoint();gesture={kind:resizeHit?'resize':'move',start:p,original:clone(selected),item:selected}}render();return}if(tool==='eraser'){checkpoint();gesture={kind:'erase'};erase(p);return}if(tool==='note'||tool==='text'){checkpoint();const o={id:uid(),type:tool,x:p.x,y:p.y,w:tool==='note'?240:300,h:tool==='note'?200:100,color,width,size:22,text:''};items.push(o);selected=o;editText(o);changed();return}checkpoint();const o={id:uid(),type:tool,color,width,x:p.x,y:p.y,w:0,h:0};if(tool==='pen')o.points=[p];items.push(o);gesture={kind:'draw',item:o,start:p};render()};

canvas.ondblclick=e=>{const o=hit(world(position(e)));if(o&&['note','text'].includes(o.type)){checkpoint();editText(o)}};function editText(o){textEditor=document.createElement('textarea');textEditor.className='text-edit';textEditor.value=o.text;Object.assign(textEditor.style,{left:(o.x*view.z+view.x)+'px',top:(o.y*view.z+view.y)+'px',width:Math.max(180,o.w*view.z)+'px',height:Math.max(90,o.h*view.z)+'px',fontSize:Math.max(12,(o.size||22)*view.z)+'px'});textEditor.setAttribute('aria-label',o.type==='note'?'Sticky note text':'Canvas text');document.body.append(textEditor);textEditor.object=o;textEditor.onblur=finishText;textEditor.onkeydown=e=>{e.stopPropagation();if(e.key==='Escape'||(e.key==='Enter'&&(e.ctrlKey||e.metaKey)))finishText()};textEditor.focus()}

function renderExport(max=2400){const b=contentBounds(),padding=45,scale=Math.min(2,max/Math.max(b.w+padding*2,b.h+padding*2)),c=document.createElement('canvas');c.width=Math.max(1,Math.ceil((b.w+padding*2)*scale));c.height=Math.max(1,Math.ceil((b.h+padding*2)*scale));const g=c.getContext('2d');g.fillStyle='white';g.fillRect(0,0,c.width,c.height);g.scale(scale,scale);g.translate(padding-b.x,padding-b.y);items.forEach(o=>drawObject(g,o));return c}function thumbnail(){try{return renderExport(420).toDataURL('image/webp',.65)}catch{return ''}}async function exportPNG(){finishText();await Promise.all(items.filter(o=>o.type==='image').map(o=>{const im=loadImage(o.src);return im.decode().catch(()=>{})}));renderExport().toBlob(blob=>{if(!blob)return;const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=($('title').value||'Whiteboard')+'.png';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)})}
async function addImages(files,at){if(!current)return;const boardId=current.id;for(const file of files){if(!/^image\/(png|jpeg|webp|gif)$/.test(file.type)){toast('Use a PNG, JPEG, WebP, or GIF image');continue}if(file.size>15*1024*1024){toast('Please use images under 15 MB');continue}try{toast('Adding image…');const data=await api('assets',{method:'POST',headers:{'Content-Type':file.type},body:file});const img=loadImage(data.url);await img.decode();if(current?.id!==boardId)return;const p=at||world({x:W/2,y:H/2}),s=Math.min(1,650/img.naturalWidth,500/img.naturalHeight),o={id:uid(),type:'image',src:data.url,x:p.x-img.naturalWidth*s/2,y:p.y-img.naturalHeight*s/2,w:img.naturalWidth*s,h:img.naturalHeight*s};checkpoint();items.push(o);setTool('select');selected=o;changed()}catch(e){toast('Image upload failed. Please try again.')}}}
